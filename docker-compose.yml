services:
  backend:
    build:
      context: ./backend
    ports:
      - "8741:8741"
    environment:
      APPREVIEW_ENVIRONMENT: development
      APPREVIEW_CORS_ORIGINS: http://localhost:3741,http://127.0.0.1:3741
      APPREVIEW_DATABASE_URL: sqlite+aiosqlite:///./data/appreviewr.db
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8741/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8741
    ports:
      - "3741:3741"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8741
      PORT: "3741"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
